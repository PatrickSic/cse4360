# proj1.cfg 
# anything not listed keeps the compiled-in default of the ev3 brick

# --- geometry ------------------------------------------------------
wheel_diameter 0.056     # m; new = old * (measured / commanded)
track_width    0.108     
robot_radius   0.18      
safety_margin  0.04      

# --- ports & signs -------------------------------------------------
left_motor  B            
right_motor C
gyro_port   2            
drive_sign  1            # -1 if the robot drives backwards
gyro_sign   -1           # -1 if a left turn gives a negative heading
start_heading 0         

# --- driving straight ----------------------------------------------
drive_speed     35
drive_speed_min 12
slow_zone  0.12          # meters before target where it slows down
brake_m    0.015         # braking roll
drive_kp   2.0           # heading hold gain (for example the gain would be lower if the robot was wiggling)
drive_ki   1.0           # integral gain
drive_kd   0.0           # derivative gain
corr_max   15
motor_trim 0.0           # from trim_test

# --- turning in place ----------------------------------------------
turn_speed_max 25
turn_speed_min 5         # lower if it overshoots, higher if it creeps
turn_kp   0.6
turn_ki   0.0            # this is usually zero
turn_kd   0.0            
turn_tol  2.0            # in degrees
turn_lag  0.05           # seconds of gyro lag compensated
turn_settle_ms 250
turn_retries 4
